[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-assistant"
version = "0.1.0"
description = "Multi-agent financial research assistant built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langsmith>=0.1",
    "pydantic>=2.0",
    "pandas>=2.0",
    "requests>=2.31",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
]

[project.scripts]
financial-assistant = "financial_assistant.cli:main"
financial-backtest = "financial_assistant.backtest_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I"]
