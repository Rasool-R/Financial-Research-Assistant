[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-assistant"
version = "0.1.0"
description = "Multi-agent financial research assistant built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-openai",
    "python-dotenv",
    "langsmith",
]

[tool.setuptools.packages.find]
where = ["src"]